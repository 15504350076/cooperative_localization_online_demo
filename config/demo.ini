# 浙大三车协同定位在线演示默认配置。
# 默认使用标准 ROS 2 IMU 瞬时量进行 15 维状态预测，并用平台间测距异步更新。
# 导航坐标系为 ENU，车体坐标系为 FLU；节点 1 是主参考节点。

[engine]
edge_timeout_ns = 500000000
max_future_skew_ns = 100000000
max_receive_delay_ns = 500000000
duplicate_cache_per_link = 128
max_nodes = 64
max_edges = 2016
max_state_dimension = 252
rigidity_tolerance = 1e-9

[filter]
reference_node_id = 1
process_accel_std_mps2 = 0.2
nis_gate = 9.21
max_prediction_step_s = 0.25
min_covariance_diagonal = 1e-12

[degradation]
window_ns = 2000000000
nominal_rate_hz = 20
nlos_ratio_threshold = 0.30
valid_ratio_threshold = 0.80
rate_ratio_threshold = 0.80
nlos_probability_threshold = 0.50
nlos_covariance_scale = 4
suspend_duration_ns = 1000000000
reject_duration_ns = 3000000000
recovery_duration_ns = 1000000000
max_tracked_edges = 2016

[online]
input_bind_address = 0.0.0.0
input_port = 39001
output_address = 127.0.0.1
output_port = 39002
input_rate_hz = 100
output_rate_hz = 10
event_log_enabled = true
event_log_path = logs/cooperative_localization_demo.zjlg
max_payload_size = 1048576
max_log_record_size = 1048616

[inertial]
enabled = true
max_inertial_state_dimension = 960
gravity_mps2 = 9.80665
min_imu_dt_s = 0.000001
max_imu_dt_s = 0.1
max_propagation_substep_s = 0.01
gyro_noise_density_rad_s_sqrt_hz = 0.0001
accel_noise_density_m_s2_sqrt_hz = 0.001
gyro_bias_random_walk_rad_s2_sqrt_hz = 0.000001
accel_bias_random_walk_m_s3_sqrt_hz = 0.00001
min_covariance_diagonal = 1e-12
quaternion_norm_tolerance = 0.001
covariance_symmetry_tolerance = 1e-9
use_message_covariance = false
use_orientation_for_initialization = false
expected_frame_id = imu_link
initial_z_m = 0
initial_vz_mps = 0
attitude_std_rad = 0.1
gyro_bias_std_rad_s = 0.01
accel_bias_std_m_s2 = 0.1

[node.1]
x = 0
y = 0
vx = 0
vy = 0
position_std_m = 0.1
velocity_std_mps = 0.1

[node.2]
x = 3
y = 0
vx = 0
vy = 0
position_std_m = 0.1
velocity_std_mps = 0.1

[node.3]
x = 0
y = 4
vx = 0
vy = 0
position_std_m = 0.1
velocity_std_mps = 0.1
