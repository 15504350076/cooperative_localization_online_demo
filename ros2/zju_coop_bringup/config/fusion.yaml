/**/zju_cooperative_fusion_node:
  ros__parameters:
    # Default deployment works with only three same-epoch UWB edges.
    # Set imu_uwb only when all vehicles publish a common-horizontal-frame NodeState.
    input_mode: uwb_only
    node_ids: [1, 2, 3]
    reference_node_id: 1
    common_enu_frame_id: common_enu
    publish_rate_hz: 10.0
    range_std_m: 0.1
    minimum_triangle_height_m: 0.001
    # Wait briefly for reciprocal measurements, then accept a single direction.
    # An incomplete epoch is invalidated after the longer timeout.
    uwb_epoch_wait_ms: 10
    uwb_epoch_timeout_ms: 100
    # 以下三个名称保留给旧 launch/YAML；当前只由三角形求解器做最终几何判定，
    # 不再在适配层重复拦截互测差异或距离跳变。
    uwb_reciprocal_max_difference_m: 0.5
    uwb_maximum_range_rate_mps: 10.0
    uwb_range_jump_tolerance_m: 0.5
    node_state_timeout_ms: 300
    # Data-age rejection guards, not UWB synchronization-accuracy targets.
    max_future_skew_ms: 100
    max_receive_delay_ms: 500
