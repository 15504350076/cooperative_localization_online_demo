# 1. 从 gpsd 获取 NMEA 绝对时间（通过 SHM 0）
# precision 1e-3: NMEA 精度较低（毫秒级）
# offset 0.0: 根据实际串口传输延迟微调（秒）
refclock SHM 0 refid NMEA precision 1e-3 offset 0.0 delay 0.2 poll 0 noselect

# 2. 从 gpsd 获取 PPS 高精度脉冲（通过 SHM 2）
# require: 强制要求此源有效才同步
# lock NMEA: 锁定 NMEA 源，因为 PPS 只有秒级脉冲，需要 NMEA 补齐绝对时间
# trust: 信任此源作为主时钟
#refclock SHM 2 refid PPS precision 1e-7 offset 0.0 delay 0.1 poll 2 require lock NMEA trust
refclock PPS /dev/pps0 refid PPS lock NMEA trust prefer

# 允许大跨度时间调整（如果系统时间与GPS时间相差太大，直接跳变）
makestep 1.0 -1
maxchange 99999999 -1 0
# 允许作为 NTP 服务器对外提供时间（可选）
allow all

# 当没有外部网络源时，保持本地层级
local stratum 10


